name: Build NOVA CART Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          else
            mkdir -p "$ANDROID_HOME/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore and env
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          [ -f .env ] || touch .env

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK with brand name
        run: cp app/build/outputs/apk/debug/app-debug.apk nova-cart.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-cart-apk
          path: nova-cart.apk

      - name: Publish GitHub Release for Direct Mobile & LinkedIn Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: NOVA CART Android App
          body: |
            Official NOVA CART Android APK (Coming Soon release with Shopify launch readiness and NOVA Concierge).
            Download `nova-cart.apk` below to install on Android.
          files: nova-cart.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
