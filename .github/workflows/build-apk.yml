name: Build NOVA CART Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDK_MANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi
          mkdir -p "$ANDROID_HOME/licenses"
          grep -q "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || \
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          grep -q "84831b9409646a918e30573bab4c9c91346d8abd" "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || \
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore and env
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK
        run: >
          gradle :app:assembleDebug
          --no-configuration-cache
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Dkotlin.compiler.execution.strategy=daemon
          --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk nova-cart.apk
          ls -lh nova-cart.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-cart-apk
          path: nova-cart.apk

      - name: Publish GitHub Release for Direct Mobile & LinkedIn Link
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: NOVA CART Android App
          body: |
            Official NOVA CART Android APK (Live Shopify Storefront, Cart, UPI/COD Checkout, Wishlist, Order Tracking & NOVA Concierge).
            Download `nova-cart.apk` below to install on Android.
          files: nova-cart.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
